name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  documentation-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run project CI checks
        run: ./.infra/bin/project-ci-check.sh
