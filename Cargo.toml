[package]
name = "qubit-spi"
version = "0.2.3"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-spi"
description = "Typed service provider registry infrastructure for Rust"
homepage = "https://github.com/qubit-ltd/rs-spi"
documentation = "https://docs.rs/qubit-spi"
readme = "README.md"
keywords = ["spi", "provider", "registry", "service", "qubit"]
categories = ["rust-patterns"]
exclude = [
    "align-ci.sh",
    "ci-check.sh",
    "coverage.sh",
    "style-check.sh",
    "update-submodule.sh",
    ".github/*",
    ".llvm-cov.toml",
    ".cargo-audit.toml.example",
]

[lib]
name = "qubit_spi"
doctest = true

[dependencies]
log = "0.4"
thiserror = "2.0"
